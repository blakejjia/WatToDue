<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    .icon-container {
      width: 512px;
      height: 512px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .icon-squircle {
      width: 460px;
      height: 460px;
      border-radius: 105px;
      background: linear-gradient(145deg, #FFE066 0%, #F59E0B 75%, #D97706 100%);
      box-shadow: 0 24px 48px rgba(245, 158, 11, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 4px solid rgba(255, 255, 255, 0.4);
    }

    .icon-w {
      font-size: 290px;
      font-weight: 900;
      color: #11141B;
      letter-spacing: -14px;
      margin-left: -12px;
      margin-top: -15px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
      user-select: none;
    }

    .icon-badge {
      position: absolute;
      bottom: 22px;
      right: 22px;
      width: 130px;
      height: 130px;
      border-radius: 36px;
      background: #11141B;
      border: 6px solid #FFFFFF;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check-svg {
      width: 72px;
      height: 72px;
      stroke: #FDD54F;
      stroke-width: 5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Promo Tile (440x280) */
    .promo-container {
      width: 440px;
      height: 280px;
      background: linear-gradient(135deg, #0F1219 0%, #171B26 60%, #1F2433 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 1px solid #283042;
    }

    .promo-glow {
      position: absolute;
      top: -40px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(253, 213, 79, 0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .promo-logo {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      background: linear-gradient(145deg, #FFE066 0%, #F59E0B 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.5);
      margin-bottom: 14px;
    }

    .promo-logo span {
      font-size: 48px;
      font-weight: 900;
      color: #11141B;
      letter-spacing: -2px;
      margin-top: -3px;
    }

    .promo-title {
      font-size: 26px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }

    .promo-title span {
      color: #FDD54F;
    }

    .promo-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #94A3B8;
      margin-top: 4px;
      letter-spacing: 0.2px;
    }

    .promo-pill {
      margin-top: 14px;
      padding: 4px 12px;
      background: rgba(253, 213, 79, 0.12);
      border: 1px solid rgba(253, 213, 79, 0.25);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      color: #FDE68A;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div id="icon-target" class="icon-container">
    <div class="icon-squircle">
      <span class="icon-w">W</span>
      <div class="icon-badge">
        <svg class="check-svg" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
    </div>
  </div>

  <div id="promo-target" class="promo-container">
    <div class="promo-glow"></div>
    <div class="promo-logo">
      <span>W</span>
    </div>
    <div class="promo-title">WatTo<span>Due</span></div>
    <div class="promo-subtitle">Waterloo LEARN Dues, Calendar & Grades</div>
    <div class="promo-pill">
      <span>University of Waterloo</span>
      <span>•</span>
      <span>Chrome Extension</span>
    </div>
  </div>
</body>
</html>
