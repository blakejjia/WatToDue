name: Package Extension

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with this build'
        type: boolean
        default: false
        required: false
  push:
    tags:
      - 'v*'
      - '1.*'
      - '[0-9]+*'

permissions:
  contents: write

jobs:
  package:
    name: Test & Package Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Unit Tests
        run: npm test

      - name: Package Extension ZIP
        run: node scripts/pack.js

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatToDue-Extension-ZIP
          path: dist/*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

      - name: Upload & Publish to Chrome Web Store
        if: env.CHROME_CLIENT_ID != '' && startsWith(github.ref, 'refs/tags/')
        uses: mnao305/chrome-extension-upload@v7.0.0
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
        with:
          file-path: dist/WatToDue-v1.0.0.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
