<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatToDue</title>
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body class="popup-mode">
  <div class="popup-container">
    <header class="popup-header">
      <div class="popup-brand">
        <h1 class="popup-title">Dues</h1>
        <span class="popup-count-badge" id="popup-count-badge">0 Due</span>
      </div>
      <div class="popup-actions">
        <button class="btn-pill" id="open-full-btn" title="Open Full Dashboard in new tab" style="display:inline-flex;align-items:center;gap:4px;">
          <span>+ Dashboard</span>
          <i data-lucide="external-link" style="width:12px;height:12px;"></i>
        </button>
        <button class="btn-pill btn-icon-only" id="sync-quick-btn" title="Refresh Waterloo LEARN data" style="display:inline-flex;align-items:center;justify-content:center;">
          <i data-lucide="refresh-cw" style="width:13px;height:13px;"></i>
        </button>
      </div>
    </header>
    <div id="banner-container"></div>
    <main class="popup-body" id="popup-body"></main>
  </div>
  <script src="src/vendor/lucide.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
